<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../pages/educammunity.css">

<body>
    <!-- <div class=" container" >
        <div class="position-absolute top-0 start-0 bg-blue1">hello </div>
    </div> -->
    
    <div id="forumChatContainer" class="container bg-blue1 rounded border-start border-end border-info">
        <div id="messagesContainer" class="border mb-3 container">
            
            
        </div>
        <div id="messageWrite" class="border p-3 border-2">
            <form action="">
                <div class="mb-3">
                <!-- <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label> -->
                <textarea class="form-control" id="messageBox" placeholder="Gõ tin nhắn bình luận bạn muốn ghi vào đây" rows="3"></textarea>
                </div>
                <button class="btn btn-outline-success" type="button" id="btnSendMessage">Gửi đi</button>
            </form>
        </div>
    </div>
</body>
